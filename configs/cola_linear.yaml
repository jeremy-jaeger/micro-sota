# Stretch: same harness, different GLUE subset. CoLA is reported with
# Matthews correlation; there is no 90% accuracy claim on this task.
task: cola
seed: 42
type: linear
model:
  type: linear
  name: tfidf-lr-cola
  variant: tfidf_lr
  use_word: true
  use_char: true
  word_tfidf:
    ngram_range: [1, 2]
    min_df: 2
    max_df: 0.95
    max_features: 30000
    sublinear_tf: true
  char_tfidf:
    analyzer: char_wb
    ngram_range: [3, 5]
    min_df: 2
    max_df: 0.95
    max_features: 20000
    sublinear_tf: true
  classifier: logreg
  C: 1.0
  solver: liblinear
  max_iter: 2000
train:
  internal_val_ratio: 0.10
