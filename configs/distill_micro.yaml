task: sst2
seed: 42
teacher:
  pretrained: distilbert-base-uncased-finetuned-sst-2-english
student:
  type: micro
  name: distilled-micro-2l-128d
  vocab_size: 4096
  hidden_size: 128
  embedding_size: 64
  num_layers: 2
  num_heads: 4
