[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "micro-sota"
version = "0.1.0"
description = "Lowest-parameter model that exceeds 90% accuracy on GLUE SST-2, with continuous verification."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Jeremy Jaeger" }]
keywords = ["nlp", "sst-2", "glue", "tiny-models", "reproducibility"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "License :: OSI Approved :: MIT License",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "torch>=2.2",
  "transformers>=4.40",
  "datasets>=2.19",
  "accelerate>=0.30",
  "evaluate>=0.4",
  "scikit-learn>=1.4",
  "scipy>=1.11",
  "numpy>=1.26",
  "typer>=0.12",
  "pyyaml>=6.0",
  "rich>=13.0",
  "joblib>=1.3",
  "tokenizers>=0.19",
  "safetensors>=0.4",
  "huggingface_hub>=0.23",
  "tqdm>=4.66",
]

[project.optional-dependencies]
quant = [
  "onnx>=1.16",
  "onnxruntime>=1.18",
  "optimum>=1.20",
]
bnb = [
  "bitsandbytes>=0.43",
]
plot = [
  "matplotlib>=3.8",
]
dev = [
  "pytest>=8.0",
  "ruff>=0.5",
]
all = [
  "micro-sota[quant,plot,dev]",
]

[project.scripts]
micro-sota-train = "train:app"
micro-sota-distill = "distill:app"
micro-sota-quantize = "quantize:app"
micro-sota-evaluate = "evaluate:app"
micro-sota-predict = "predict:app"

[project.urls]
Homepage = "https://github.com/jeremy-jaeger/micro-sota"
Documentation = "README.md"

[tool.setuptools]
package-dir = { "" = "src" }
py-modules = [
  "train",
  "distill",
  "quantize",
  "evaluate",
  "predict",
  "model_utils",
  "micro_model",
  "linear_model",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.micro-sota]
seed = 42
accuracy_threshold = 0.90
task = "sst2"
